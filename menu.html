<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu Favorito - CAPSULABITS</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./Recursos/icono.ico">

    <!-- Tailwind CSS & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>

    <!-- Estilos Base y Fuentes -->
    <link rel="stylesheet" href="./css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-capsula-dark bg-grid-pattern min-h-screen flex flex-col items-center justify-center py-10">

    <!-- Botón de Regreso -->
<a href="./index.html" class="absolute top-6 left-6 text-capsula-cyan hover:text-white flex items-center gap-2 font-display uppercase tracking-widest transition-colors z-50">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Volver a la Base
</a>

<!-- Contenedor expandido para usar los extremos de la pantalla -->
<div class="w-full max-w-[95%] 2xl:max-w-screen-2xl mx-auto px-4 mt-16 relative z-10 flex flex-col items-center">
    
    <!-- Título -->
    <h1 class="font-display text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-capsula-fuchsia to-capsula-cyan uppercase tracking-[0.2em] mb-12 text-center">
        CHOOSE YOUR FIGHTER
    </h1>

    <!-- Grid expandido con mayor gap (separación) y margen inferior (mb-24) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 lg:gap-24 items-center w-full mb-24">
        
        <!-- Izquierda: STATS -->
        <div class="glass-panel p-6 rounded-xl border border-capsula-bronze/50 order-2 lg:order-1 flex flex-col justify-center space-y-6">
            <h2 class="font-display text-2xl text-white uppercase border-b border-gray-700 pb-2 mb-4">Stats Base</h2>
            <div>
                <span class="text-gray-300 font-bold uppercase tracking-wider text-sm">Sabor</span>
                <div id="stat-sabor" class="flex gap-1 mt-1 text-capsula-bronze neon-text-bronze"></div>
            </div>
            <div>
                <span class="text-gray-300 font-bold uppercase tracking-wider text-sm">Picor</span>
                <div id="stat-picor" class="flex gap-1 mt-1 text-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>
            </div>
            <div>
                <span class="text-gray-300 font-bold uppercase tracking-wider text-sm">Monchosidad</span>
                <div id="stat-monchoso" class="flex gap-1 mt-1 text-capsula-cyan neon-text-cyan"></div>
            </div>
        </div>

        <!-- Centro: IMAGEN DEL PERSONAJE -->
        <div class="flex flex-col items-center justify-center order-1 lg:order-2 h-[300px] lg:h-[400px] relative">
            <div class="absolute inset-0 bg-capsula-fuchsia rounded-full blur-[80px] opacity-20 pointer-events-none animate-pulse"></div>
            <h2 id="item-name" class="absolute -top-10 font-display text-3xl font-bold text-white uppercase neon-text-fuchsia z-20 text-center w-max">Burger Clásica</h2>
            
            <div id="item-image" class="w-48 h-48 lg:w-72 lg:h-72 text-white z-10 drop-shadow-[0_0_20px_rgba(217,70,239,0.5)] transition-transform duration-300 hover:scale-110">
                <!-- SVG Dinámico -->
            </div>
        </div>

        <!-- Derecha: LORE / INFO -->
        <div class="glass-panel p-6 rounded-xl border border-capsula-cyan/50 order-3 flex flex-col justify-center h-full">
            <h2 class="font-display text-2xl text-white uppercase mb-6">Lore / Info</h2>
            <div class="space-y-4">
                <p id="item-desc" class="text-gray-300 text-lg leading-relaxed font-mono">
                    Carne de res premium, queso fundido, tocino crujiente, lechuga y aderezo de la casa.
                </p>
                <div class="border-t border-dashed border-gray-600 pt-4 mt-4">
                    <span class="text-gray-400 font-bold uppercase text-sm">Precio:</span>
                    <span id="item-price" class="text-2xl font-bold text-capsula-cyan ml-2">$139</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Abajo: ROSTER DE SELECCIÓN -->
    <!-- Abajo: ROSTER DE SELECCIÓN -->
    <div class="w-full max-w-5xl flex items-center justify-between gap-4 md:gap-6">
        
        <!-- Flecha Izquierda -->
        <button id="btn-prev" class="text-capsula-fuchsia hover:text-white transition-transform hover:-translate-x-2 focus:outline-none shrink-0">
            <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        
        <!-- Cuadros de selección -->
        <!-- SOLUCIÓN A LOS RECORTES Y EL SCROLLBAR: -->
        <!-- 1. py-6 (padding vertical) da espacio para que el cuadrito crezca sin chocar con los bordes. -->
        <!-- 2. items-center asegura que crezcan desde el centro. -->
        <!-- 3. Las clases entre corchetes [] ocultan la barra espantosa en Chrome, Edge y Firefox. -->
        <div id="roster-container" class="flex gap-4 overflow-x-auto py-6 px-4 flex-1 justify-center items-center [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
            <!-- Se llenan por JavaScript -->
        </div>

        <!-- Flecha Derecha -->
        <button id="btn-next" class="text-capsula-fuchsia hover:text-white transition-transform hover:translate-x-2 focus:outline-none shrink-0">
            <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>
</div>

<script src="./js/menu-select.js"></script>

    <!-- Script de Selección de Personajes -->
    <script src="./js/menu-select.js"></script>
</body>
</html>
